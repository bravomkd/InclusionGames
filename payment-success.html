<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InclusionGames — Payment</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
:root { --bg:#0f0e17;--card:#1e1d2e;--accent:#6C63FF;--accent2:#ff6584;--text:#fffffe;--text2:#a7a9be;--green:#43e97b; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(108,99,255,0.15) 0%,transparent 60%);pointer-events:none;}
.container{width:100%;max-width:440px;text-align:center;}
.logo{font-family:'Fredoka One',cursive;font-size:2rem;background:linear-gradient(135deg,#6C63FF,#ff6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:32px;display:block;}
.card{background:var(--card);border-radius:20px;padding:40px 32px;border:1px solid rgba(255,255,255,0.06);}
.icon{font-size:4rem;margin-bottom:16px;display:block;}
h2{font-family:'Fredoka One',cursive;font-size:1.8rem;margin-bottom:12px;}
p{color:var(--text2);font-size:0.95rem;line-height:1.6;margin-bottom:24px;}
.btn{display:inline-block;padding:14px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;text-decoration:none;transition:opacity 0.2s;}
.btn:hover{opacity:0.9;}
.btn.secondary{background:none;border:1px solid rgba(255,255,255,0.14);color:var(--text2);margin-left:8px;}
.spinner{width:48px;height:48px;border:4px solid rgba(108,99,255,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.success{color:var(--green);}
.error-msg{color:#ff6b6b;}
.plan{display:inline-block;font-weight:900;color:var(--text);background:rgba(108,99,255,0.16);border:1px solid rgba(108,99,255,0.35);border-radius:100px;padding:6px 16px;margin-bottom:20px;}
.note{font-size:0.8rem;color:var(--text2);opacity:0.75;margin-top:20px;margin-bottom:0;}
</style>
</head>
<body>
<div class="container">
  <span class="logo">🎈 InclusionGames</span>
  <div class="card" id="card">
    <div class="spinner"></div>
    <p>Confirming your payment…</p>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
/* This page is where BOTH checkout flows land, and it is the step that
   actually activates the plan:
     Stripe        → ?method=stripe&session_id=cs_...
     PayPal (live) → ?method=paypal&token=<orderID>   (PayPal appends token)
     PayPal (demo) → ?method=paypal                   (already captured)
     Stripe demo   → ?demo=1&plan=...&session_id=demo_...
   The server decides which plan was really bought; the query string is only
   used to work out which call to make. */

var PLAN_NAMES = { starter:'Starter', family:'Family', educator:'Educator', school:'School' };
var card = document.getElementById('card');
var q = new URLSearchParams(location.search);

function render(html) { card.innerHTML = html; }

function showSuccess(user) {
  var planName = PLAN_NAMES[user && user.plan] || 'your';
  render(
    '<span class="icon">🎉</span>' +
    '<h2 class="success">Payment complete!</h2>' +
    '<div class="plan">' + planName + ' plan · active</div>' +
    '<p>Thank you! Your subscription is live and every game is unlocked. ' +
    'A receipt is on its way to your email.</p>' +
    '<a href="dashboard.html" class="btn">Start playing →</a>' +
    '<p class="note">Manage or cancel any time from your account page.</p>'
  );
}

function showError(msg, opts) {
  opts = opts || {};
  render(
    '<span class="icon">' + (opts.icon || '⚠️') + '</span>' +
    '<h2 class="error-msg">' + (opts.title || 'We could not confirm your payment') + '</h2>' +
    '<p>' + msg + '</p>' +
    '<a href="' + (opts.href || 'index.html#pricing') + '" class="btn">' + (opts.cta || 'Back to plans') + '</a>' +
    '<a href="contact.html" class="btn secondary">Contact support</a>' +
    '<p class="note">If you were charged, do not pay again — contact us and we will sort it out straight away.</p>'
  );
}

async function finish() {
  // Activating a plan needs a signed-in session; the token is what proves it.
  if (!window.IG || !IG.isAuthed()) {
    render(
      '<span class="icon">🔑</span>' +
      '<h2>Please sign in</h2>' +
      '<p>Sign in with the account you bought the subscription for, and we will finish activating it.</p>' +
      '<a href="login.html?next=' + encodeURIComponent(location.pathname + location.search) + '" class="btn">Sign in →</a>'
    );
    return;
  }

  var method = q.get('method');
  var paypalOrder = q.get('token');        // PayPal appends ?token=<orderID> on return

  try {
    var result;

    if (method === 'paypal' && paypalOrder) {
      // Live PayPal: the buyer approved the order, capture it now.
      result = await IG.apiFetch('/payments/paypal/capture', {
        method: 'POST',
        body: JSON.stringify({ orderID: paypalOrder })
      });
    } else if (method === 'paypal') {
      // Demo PayPal already captured before redirecting here — just re-read.
      result = { user: await IG.refresh() };
    } else {
      // Stripe (live or demo). The demo branch is the only one that needs the
      // plan in the URL; with real keys the server reads it off the session.
      var params = new URLSearchParams();
      if (q.get('session_id')) params.set('session_id', q.get('session_id'));
      if (q.get('plan')) params.set('plan', q.get('plan'));
      if (q.get('billing')) params.set('billing', q.get('billing'));
      result = await IG.apiFetch('/payments/verify-session?' + params.toString());
    }

    if (result && result.token) IG.setSession(result.token, result.user);
    else if (result && result.user) IG.setSession(null, result.user);

    var user = (result && result.user) || await IG.refresh();
    if (user && user.status === 'active') { showSuccess(user); return; }

    showError(
      'Your payment went through, but the account has not switched over yet. ' +
      'This usually settles within a minute — reload this page, or contact us if it does not.',
      { icon: '⏳', title: 'Almost there', cta: 'Reload', href: location.href }
    );
  } catch (err) {
    if (err && err.status === 402) {
      showError('The payment was not completed, so nothing has been charged. You can try again whenever you are ready.',
        { title: 'Payment not completed' });
    } else if (err && err.status === 403) {
      showError('This payment belongs to a different account. Please sign in with the account you used at checkout.',
        { icon: '🔑', title: 'Wrong account', cta: 'Switch account', href: 'login.html' });
    } else {
      showError((err && err.message) || 'Something went wrong while confirming the payment.');
    }
  }
}

finish();
</script>
</body>
</html>
