<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Colour Mixer — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game33 — Colour Mixer. Mix two colours, pop the result. */
var MIX=[['🔴','🟡','🟠'],['🔵','🟡','🟢'],['🔴','🔵','🟣'],['🔴','⚪','🩷'],['🔴','🟢','🟤'],['🔵','⚪','🩵']];
var ALL=['🟠','🟢','🟣','🩷','🟤','🩵'];
var HUD={en:'WHAT COLOUR?',de:'WELCHE FARBE?',pl:'JAKI KOLOR?',es:'¿QUÉ COLOR?'};
var ASK={en:'Mix these colours. What do you get?',de:'Misch diese Farben. Was kommt heraus?',pl:'Zmieszaj te kolory. Co powstanie?',es:'Mezcla estos colores. ¿Qué sale?'};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game33', icon:'🎨', hero:'🧑‍🎨', villain:'🖤', castle:'🏰',
  text:{
    en:{tag:'Art · Grades 1–3 · Game #33', title:'Colour ', titleEm:'Mixer!', desc:'Mix two colours and pop the colour you get.', quest:'🎨 Repaint the grey castle! Mix the right colours to bring it back to life.', questLbl:'REPAINT THE CASTLE'},
    de:{tag:'Kunst · Kl. 1–3 · Spiel #33', title:'Farben-', titleEm:'Mischer!', desc:'Mische zwei Farben und triff das Ergebnis.', quest:'🎨 Male die graue Burg neu! Mische die richtigen Farben, um sie zum Leben zu erwecken.', questLbl:'BURG NEU MALEN'},
    pl:{tag:'Plastyka · Kl. 1–3 · Gra #33', title:'Mieszacz ', titleEm:'Kolorów!', desc:'Zmieszaj dwa kolory i traf wynik.', quest:'🎨 Pomaluj szary zamek na nowo! Zmieszaj właściwe kolory, aby przywrócić go do życia.', questLbl:'POMALUJ ZAMEK'},
    es:{tag:'Arte · Grados 1–3 · Juego #33', title:'Mezcla ', titleEm:'Colores!', desc:'Mezcla dos colores y revienta el que sale.', quest:'🎨 ¡Repinta el castillo gris! Mezcla los colores correctos para devolverle la vida.', questLbl:'REPINTA EL CASTILLO'}
  },
  rounds:function(lang,level,mode,count){
    var out=[], pool=shuf(MIX);
    for(var i=0;i<count;i++){var m=pool[i%pool.length];out.push({hud:HUD[lang]||HUD.en,big:m[0]+' + '+m[1],word:null,speech:ASK[lang]||ASK.en,praise:m[2],correct:m[2],distractors:shuf(ALL.filter(function(c){return c!==m[2];}))});}
    return out;
  }
});
</script>
</body></html>
