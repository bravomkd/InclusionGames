<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Family Tree — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game17 — Family Tree. Family members in English. */
var ITEMS=[['👩','Mother'],['👨','Father'],['👧','Sister'],['👦','Brother'],['👵','Grandma'],['👴','Grandpa'],['👶','Baby'],['🧒','Child']];
var HUD={en:'IN ENGLISH',de:'AUF ENGLISCH',pl:'PO ANGIELSKU',es:'EN INGLÉS'};
var ASK={en:'Who is this in English?',de:'Wer ist das auf Englisch?',pl:'Kto to po angielsku?',es:'¿Quién es en inglés?'};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game17', icon:'👨‍👩‍👧', hero:'🧒', villain:'🌪️', castle:'🏰',
  text:{
    en:{tag:'English · Grade 3 · Game #17', title:'Family ', titleEm:'Tree!', desc:'Learn family words in English — pop the right one.', quest:'🌳 Grow the family tree! Each English word adds a branch reaching toward the castle.', questLbl:'GROW THE TREE'},
    de:{tag:'Englisch · Kl. 3 · Spiel #17', title:'Familien-', titleEm:'Baum!', desc:'Lerne Familienwörter auf Englisch — triff das richtige.', quest:'🌳 Lass den Familienbaum wachsen! Jedes englische Wort fügt einen Ast zur Burg hinzu.', questLbl:'BAUM WACHSEN LASSEN'},
    pl:{tag:'Angielski · Kl. 3 · Gra #17', title:'Drzewo ', titleEm:'Rodzinne!', desc:'Ucz się słów o rodzinie po angielsku — trafiaj właściwe.', quest:'🌳 Rozwijaj drzewo rodzinne! Każde angielskie słowo dodaje gałąź sięgającą zamku.', questLbl:'ROZWIJAJ DRZEWO'},
    es:{tag:'Inglés · Grado 3 · Juego #17', title:'Árbol ', titleEm:'Familiar!', desc:'Aprende la familia en inglés — revienta la palabra correcta.', quest:'🌳 ¡Haz crecer el árbol familiar! Cada palabra en inglés añade una rama hacia el castillo.', questLbl:'HAZ CRECER EL ÁRBOL'}
  },
  rounds:function(lang,level,mode,count){
    var out=[], pool=shuf(ITEMS);
    for(var i=0;i<count;i++){var it=pool[i%pool.length];out.push({hud:HUD[lang]||HUD.en,big:it[0],word:null,speech:ASK[lang]||ASK.en,praise:it[1],correct:it[1],distractors:shuf(ITEMS.filter(function(x){return x[1]!==it[1];}).map(function(x){return x[1];}))});}
    return out;
  }
});
</script>
</body></html>
