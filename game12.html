<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shape Seeker — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game12 — Shape Seeker. Hear a shape name, pop the shape. */
var SHAPES=[['🔵','circle','Kreis','koło','círculo'],['🟦','square','Quadrat','kwadrat','cuadrado'],['🔺','triangle','Dreieck','trójkąt','triángulo'],['⭐','star','Stern','gwiazda','estrella'],['❤️','heart','Herz','serce','corazón'],['🔶','diamond','Raute','romb','rombo']];
var IDX={en:1,de:2,pl:3,es:4};
var HUD={en:'FIND THE SHAPE',de:'FINDE DIE FORM',pl:'ZNAJDŹ KSZTAŁT',es:'ENCUENTRA LA FORMA'};
var ASK={en:'Find the ',de:'Finde: ',pl:'Znajdź: ',es:'Encuentra: '};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game12', icon:'🔷', hero:'🧒', villain:'🌀', castle:'🏰',
  text:{
    en:{tag:'Math · Grades 1–2 · Game #12', title:'Shape ', titleEm:'Seeker!', desc:'Hear a shape name and pop the matching shape.', quest:'🔷 Rebuild the magic window! Each correct shape sets a pane of glass back in the castle.', questLbl:'REBUILD THE WINDOW'},
    de:{tag:'Mathe · Kl. 1–2 · Spiel #12', title:'Formen-', titleEm:'Finder!', desc:'Höre einen Formnamen und triff die passende Form.', quest:'🔷 Baue das Zauberfenster neu! Jede richtige Form setzt eine Scheibe in der Burg ein.', questLbl:'FENSTER BAUEN'},
    pl:{tag:'Matematyka · Kl. 1–2 · Gra #12', title:'Łowca ', titleEm:'Kształtów!', desc:'Posłuchaj nazwy kształtu i traf właściwy.', quest:'🔷 Odbuduj magiczne okno! Każdy poprawny kształt wstawia szybę w zamku.', questLbl:'ODBUDUJ OKNO'},
    es:{tag:'Mates · Grados 1–2 · Juego #12', title:'Busca ', titleEm:'Formas!', desc:'Escucha el nombre de una forma y revienta la correcta.', quest:'🔷 ¡Reconstruye la ventana mágica! Cada forma correcta coloca un cristal en el castillo.', questLbl:'RECONSTRUYE LA VENTANA'}
  },
  rounds:function(lang,level,mode,count){
    var ix=IDX[lang]||1, out=[], pool=shuf(SHAPES);
    for(var i=0;i<count;i++){
      var s=pool[i%pool.length];
      var dist=shuf(SHAPES.filter(function(x){return x[0]!==s[0];}).map(function(x){return x[0];}));
      out.push({hud:HUD[lang]||HUD.en, big:null, word:null, speech:(ASK[lang]||ASK.en)+s[ix], praise:s[ix], correct:s[0], distractors:dist});
    }
    return out;
  }
});
</script>
</body></html>
