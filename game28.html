<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instrument Band — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game28 — Instrument Band. Which instrument is this? */
var I=[['🎸','Guitar','Gitarre','Gitara','Guitarra'],['🎹','Piano','Klavier','Pianino','Piano'],['🥁','Drums','Schlagzeug','Perkusja','Batería'],['🎺','Trumpet','Trompete','Trąbka','Trompeta'],['🎻','Violin','Geige','Skrzypce','Violín'],['🎷','Saxophone','Saxofon','Saksofon','Saxofón'],['🪈','Flute','Flöte','Flet','Flauta'],['🪕','Banjo','Banjo','Banjo','Banjo']];
var IDX={en:1,de:2,pl:3,es:4};
var HUD={en:'WHICH INSTRUMENT?',de:'WELCHES INSTRUMENT?',pl:'JAKI INSTRUMENT?',es:'¿QUÉ INSTRUMENTO?'};
var ASK={en:'Which instrument is this?',de:'Welches Instrument ist das?',pl:'Jaki to instrument?',es:'¿Qué instrumento es este?'};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game28', icon:'🎺', hero:'🎼', villain:'🙉', castle:'🏰',
  text:{
    en:{tag:'Music · Grades 1–3 · Game #28', title:'Instrument ', titleEm:'Band!', desc:'Learn the names of musical instruments.', quest:'🎺 Form the royal band! Name each instrument to add a player on the way to the castle.', questLbl:'FORM THE BAND'},
    de:{tag:'Musik · Kl. 1–3 · Spiel #28', title:'Instrumenten-', titleEm:'Band!', desc:'Lerne die Namen der Musikinstrumente.', quest:'🎺 Stelle die königliche Band auf! Benenne jedes Instrument, um einen Spieler zur Burg zu bringen.', questLbl:'BAND AUFSTELLEN'},
    pl:{tag:'Muzyka · Kl. 1–3 · Gra #28', title:'Zespół ', titleEm:'Instrumentów!', desc:'Naucz się nazw instrumentów muzycznych.', quest:'🎺 Stwórz królewski zespół! Nazwij każdy instrument, aby dodać muzyka w drodze do zamku.', questLbl:'STWÓRZ ZESPÓŁ'},
    es:{tag:'Música · Grados 1–3 · Juego #28', title:'Banda de ', titleEm:'Instrumentos!', desc:'Aprende los nombres de los instrumentos.', quest:'🎺 ¡Forma la banda real! Nombra cada instrumento para sumar un músico hacia el castillo.', questLbl:'FORMA LA BANDA'}
  },
  rounds:function(lang,level,mode,count){
    var ix=IDX[lang]||1, out=[], pool=shuf(I);
    for(var i=0;i<count;i++){var s=pool[i%pool.length];out.push({hud:HUD[lang]||HUD.en,big:s[0],word:null,speech:ASK[lang]||ASK.en,praise:s[ix],correct:s[ix],distractors:shuf(I.filter(function(x){return x[0]!==s[0];}).map(function(x){return x[ix];}))});}
    return out;
  }
});
</script>
</body></html>
