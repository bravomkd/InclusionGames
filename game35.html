<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Art Studio — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game35 — Art Studio. Which art tool is this? */
var T9=[['🖌️','Brush','Pinsel','Pędzel','Pincel'],['🎨','Palette','Palette','Paleta','Paleta'],['✏️','Pencil','Bleistift','Ołówek','Lápiz'],['✂️','Scissors','Schere','Nożyczki','Tijeras'],['🖍️','Crayon','Wachsmalstift','Kredka','Cera'],['🧴','Glue','Kleber','Klej','Pegamento'],['📐','Ruler','Lineal','Linijka','Regla'],['🖊️','Pen','Stift','Długopis','Bolígrafo']];
var IDX={en:1,de:2,pl:3,es:4};
var HUD={en:'WHICH ART TOOL?',de:'WELCHES WERKZEUG?',pl:'JAKIE NARZĘDZIE?',es:'¿QUÉ HERRAMIENTA?'};
var ASK={en:'Which art tool is this?',de:'Welches Kunst-Werkzeug ist das?',pl:'Jakie to narzędzie plastyczne?',es:'¿Qué herramienta de arte es?'};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game35', icon:'🖼️', hero:'🧑‍🎨', villain:'🦝', castle:'🏰',
  text:{
    en:{tag:'Art · Grades 1–3 · Game #35', title:'Art ', titleEm:'Studio!', desc:'Learn the names of art tools.', quest:'🖼️ Open the royal studio! Name each tool to set up the workshop in the castle.', questLbl:'SET UP THE STUDIO'},
    de:{tag:'Kunst · Kl. 1–3 · Spiel #35', title:'Kunst-', titleEm:'Atelier!', desc:'Lerne die Namen der Kunst-Werkzeuge.', quest:'🖼️ Öffne das königliche Atelier! Benenne jedes Werkzeug, um die Werkstatt einzurichten.', questLbl:'ATELIER EINRICHTEN'},
    pl:{tag:'Plastyka · Kl. 1–3 · Gra #35', title:'Pracownia ', titleEm:'Sztuki!', desc:'Naucz się nazw narzędzi plastycznych.', quest:'🖼️ Otwórz królewską pracownię! Nazwij każde narzędzie, aby urządzić warsztat w zamku.', questLbl:'URZĄDŹ PRACOWNIĘ'},
    es:{tag:'Arte · Grados 1–3 · Juego #35', title:'Estudio de ', titleEm:'Arte!', desc:'Aprende los nombres de las herramientas de arte.', quest:'🖼️ ¡Abre el estudio real! Nombra cada herramienta para montar el taller en el castillo.', questLbl:'MONTA EL ESTUDIO'}
  },
  rounds:function(lang,level,mode,count){
    var ix=IDX[lang]||1, out=[], pool=shuf(T9);
    for(var i=0;i<count;i++){var s=pool[i%pool.length];out.push({hud:HUD[lang]||HUD.en,big:s[0],word:null,speech:ASK[lang]||ASK.en,praise:s[ix],correct:s[ix],distractors:shuf(T9.filter(function(x){return x[0]!==s[0];}).map(function(x){return x[ix];}))});}
    return out;
  }
});
</script>
</body></html>
