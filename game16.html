<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animal Safari — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game16 — Animal Safari. Animals in English. */
var ITEMS=[['🐶','Dog'],['🐱','Cat'],['🐮','Cow'],['🐴','Horse'],['🐷','Pig'],['🐰','Rabbit'],['🐻','Bear'],['🦁','Lion'],['🐘','Elephant'],['🐦','Bird'],['🐟','Fish'],['🐵','Monkey']];
var HUD={en:'IN ENGLISH',de:'AUF ENGLISCH',pl:'PO ANGIELSKU',es:'EN INGLÉS'};
var ASK={en:'Which animal in English?',de:'Welches Tier auf Englisch?',pl:'Jakie zwierzę po angielsku?',es:'¿Qué animal en inglés?'};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game16', icon:'🦁', hero:'🧑‍🦱', villain:'🐍', castle:'🏰',
  text:{
    en:{tag:'English · Grade 3 · Game #16', title:'Animal ', titleEm:'Safari!', desc:'Learn animal names in English — pop the right word.', quest:'🦁 Lead the safari home! Name each animal in English to guide it safely to the castle.', questLbl:'LEAD THE SAFARI'},
    de:{tag:'Englisch · Kl. 3 · Spiel #16', title:'Tier-', titleEm:'Safari!', desc:'Lerne Tiernamen auf Englisch — triff das richtige Wort.', quest:'🦁 Führe die Safari nach Hause! Benenne jedes Tier auf Englisch, um es zur Burg zu bringen.', questLbl:'FÜHRE DIE SAFARI'},
    pl:{tag:'Angielski · Kl. 3 · Gra #16', title:'Zwierzęce ', titleEm:'Safari!', desc:'Ucz się nazw zwierząt po angielsku — trafiaj właściwe słowo.', quest:'🦁 Poprowadź safari do domu! Nazwij każde zwierzę po angielsku, aby dotarło do zamku.', questLbl:'POPROWADŹ SAFARI'},
    es:{tag:'Inglés · Grado 3 · Juego #16', title:'Safari de ', titleEm:'Animales!', desc:'Aprende los animales en inglés — revienta la palabra correcta.', quest:'🦁 ¡Guía el safari a casa! Nombra cada animal en inglés para llevarlo al castillo.', questLbl:'GUÍA EL SAFARI'}
  },
  rounds:function(lang,level,mode,count){
    var out=[], pool=shuf(ITEMS);
    for(var i=0;i<count;i++){var it=pool[i%pool.length];out.push({hud:HUD[lang]||HUD.en,big:it[0],word:null,speech:ASK[lang]||ASK.en,praise:it[1],correct:it[1],distractors:shuf(ITEMS.filter(function(x){return x[1]!==it[1];}).map(function(x){return x[1];}))});}
    return out;
  }
});
</script>
</body></html>
