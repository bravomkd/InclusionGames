<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InclusionGames — My Games</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--ink:#1a1a2e;--ink2:#3d3d5c;--muted:#6b6b8a;--bg:#fafaf8;--surface:#fff;--s2:#f4f3ff;--border:#e8e6f0;--p1:#7c3aed;--p2:#a855f7;--p3:#ede9fe;--g1:#10b981;--a1:#f59e0b;--r1:#dc2626;--b1:#3b82f6;--font:'Nunito',sans-serif;--display:'Fredoka One',cursive;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;}
.topbar{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:0;}
.tb-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:14px;flex-wrap:wrap;}
.tb-logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.3rem;}
.tb-logo-box{width:36px;height:36px;background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.demo-pill{background:rgba(251,191,36,.25);border:1px solid rgba(251,191,36,.4);color:#fbbf24;font-size:.78rem;font-weight:700;padding:5px 14px;border-radius:100px;}
.tb-user{display:flex;align-items:center;gap:8px;}
.tb-avatar{width:36px;height:36px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#fff;}
.tb-name{font-size:.88rem;font-weight:700;}
.tb-role{font-size:.72rem;opacity:.7;}
.tb-logout{font-size:.78rem;font-weight:700;padding:6px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:100px;cursor:pointer;color:#fff;text-decoration:none;}
.hero{background:linear-gradient(135deg,#dc2626,#b91c1c);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.hero h2{font-family:var(--display);font-size:1.6rem;color:#fff;margin-bottom:4px;}
.hero p{font-size:.88rem;color:rgba(255,255,255,.8);max-width:500px;}
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 18px;text-align:center;border:1px solid rgba(255,255,255,.2);}
.stat-n{font-family:var(--display);font-size:1.6rem;color:#fff;line-height:1;}
.stat-l{font-size:.7rem;color:rgba(255,255,255,.7);margin-top:2px;}
.content{max-width:1200px;margin:0 auto;padding:28px 24px;}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px;}
.fc{font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;}
.fc.on{background:var(--p1);color:#fff;border-color:var(--p1);}
.age-section{margin-bottom:28px;}
.age-hdr{font-family:var(--display);font-size:1rem;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.age-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;}
.game-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;}
.game-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(124,58,237,.15);border-color:var(--p1);}
.game-card.pl-ver{border-color:rgba(220,38,38,.3);}
.game-card.pl-ver:hover{border-color:#dc2626;}
.gc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.gc-icon{font-size:2rem;line-height:1;}
.gc-badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.cat-pill{font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:100px;}
.lang-pill{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:100px;background:#fee2e2;color:#991b1b;}
.gc-title{font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:3px;}
.gc-desc{font-size:.77rem;color:var(--muted);line-height:1.45;flex:1;margin-bottom:8px;}
.gc-age{font-size:.68rem;font-weight:700;color:var(--muted);margin-bottom:6px;}
.play-btn{width:100%;padding:9px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none;border-radius:100px;font-family:var(--font);font-size:.82rem;font-weight:700;cursor:pointer;transition:transform .15s;margin-top:auto;}
.play-btn:hover{transform:scale(1.03);}
.play-btn.pl{background:linear-gradient(135deg,#dc2626,#b91c1c);}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-inner">
    <div class="tb-logo"><div class="tb-logo-box">🎈</div>InclusionGames</div>
    <span class="demo-pill">🎮 My Games</span>
    <div class="tb-user">
      <div class="tb-avatar" id="av">A</div>
      <div><div class="tb-name" id="uname">Account</div><div class="tb-role">Full access — all games</div></div>
      <a href="stroke.html" class="tb-logout" style="margin-right:6px;background:linear-gradient(135deg,#0ea5e9,#22d3ee);border-color:transparent;">🧠 Stroke Rehab</a>
      <a href="report.html" class="tb-logout" style="margin-right:6px;background:linear-gradient(135deg,#6C63FF,#ff6584);border-color:transparent;">📊 Reports</a>
      <a href="teacher.html" class="tb-logout" style="margin-right:6px;background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:transparent;">🎯 Spiele anpassen</a>
      <a href="account.html" class="tb-logout" style="margin-right:6px;">⚙️ Account</a>
      <a href="login.html" class="tb-logout" onclick="logout(event)">Log out</a>
    </div>
  </div>
</div>

<div class="hero">
  <div>
    <h2>🎮 All 42 Games — Full Access</h2>
    <p>Click any game and play right away. All accessibility modes included.</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-n">42</div><div class="stat-l">Games available</div></div>
    <div class="stat"><div class="stat-n">🌍</div><div class="stat-l">Multiple languages</div></div>
    <div class="stat"><div class="stat-n">∞</div><div class="stat-l">Your access</div></div>
  </div>
</div>

<div class="content">
  <div class="filter-bar">
    <button class="fc on" data-f="all" onclick="filt(this)">All</button>
    <button class="fc" data-f="jezyk" onclick="filt(this)">📖 Language</button>
    <button class="fc" data-f="mat" onclick="filt(this)">🔢 Math</button>
    <button class="fc" data-f="ang" onclick="filt(this)">🇬🇧 English</button>
    <button class="fc" data-f="przyr" onclick="filt(this)">🌍 Science</button>
    <button class="fc" data-f="muz" onclick="filt(this)">🎵 Music</button>
    <button class="fc" data-f="plast" onclick="filt(this)">🎨 Art</button>
    <button class="fc" data-f="sport" onclick="filt(this)">⚽ Sport</button>
  </div>
  <div id="gc"></div>
</div>

<script src="assets/auth.js"></script>
<script src="assets/catalogue.js"></script>
<script src="assets/i18n.js"></script>
<script>
// Require a signed-in session — bounce to login otherwise.
IG.requireAuth('login.html');
(function(){
  var u = IG.user();
  if (u) {
    var label = u.name || (u.email ? u.email.split('@')[0] : 'Account');
    document.getElementById('uname').textContent = label;
    document.getElementById('av').textContent = (label[0] || 'A').toUpperCase();
  }
  // Keep the cached user fresh (plan changes after purchase, etc.).
  IG.refresh().then(function(fresh){
    if (fresh) {
      var label = fresh.name || fresh.email.split('@')[0];
      document.getElementById('uname').textContent = label;
      document.getElementById('av').textContent = (label[0] || 'A').toUpperCase();
    }
  });
})();
function logout(e){ if(e) e.preventDefault(); IG.logout('index.html'); }

/* Catalogue lives in assets/catalogue.js so the dashboard, the reports
   section and the server all describe the games the same way. */
var CAT=IG_CATALOGUE.cats, GAMES=IG_CATALOGUE.games;

var activeFilter='all';

function buildGames(){
  var con=document.getElementById('gc');con.innerHTML='';
  var filtered=GAMES.filter(function(g){return activeFilter==='all'||g.cat===activeFilter;});
  var grouped={};
  filtered.forEach(function(g){if(!grouped[g.age])grouped[g.age]=[];grouped[g.age].push(g);});
  var order=['Gr. 1','Gr. 1–2','Gr. 1–3','Gr. 2','Gr. 2–3','Gr. 2–4','Gr. 3','Gr. 3–4','Gr. 4'];
  Object.keys(grouped).sort(function(a,b){return order.indexOf(a)-order.indexOf(b);}).forEach(function(age){
    var sec=document.createElement('div');sec.className='age-section';
    var hdr=document.createElement('div');hdr.className='age-hdr';hdr.textContent=age;
    sec.appendChild(hdr);
    var grid=document.createElement('div');grid.className='games-grid';
    grouped[age].forEach(function(g){
      var cs=CAT[g.cat];
      var card=document.createElement('div');
      card.className='game-card'+(g.pl?' pl-ver':'');
      card.innerHTML=
        '<div class="gc-top">'+
          '<span class="gc-icon">'+g.icon+'</span>'+
          '<div class="gc-badges">'+
            '<span class="cat-pill" style="background:'+cs.bg+';color:'+cs.color+'">'+cs.label+'</span>'+
            (g.pl?'<span class="lang-pill">🇵🇱 Polski</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="gc-title">'+g.title+'</div>'+
        '<div class="gc-desc">'+g.desc+'</div>'+
        '<div class="gc-age">'+g.age+'</div>'+
        '<button class="play-btn" onclick="playGame(\''+g.file+'\')">'+
          '🎮 Play!'+
        '</button>';
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    con.appendChild(sec);
  });
}

function playGame(file){
  // Files are one level up from games/ folder
  window.location.href=file;
}

function filt(btn){document.querySelectorAll('.fc').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');activeFilter=btn.dataset.f;buildGames();}

buildGames();
</script>
</body>
</html>
