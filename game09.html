<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Plus Power — InclusionGames</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/game-engine.css">
</head><body>
<script src="assets/game-engine.js"></script>
<script>
/* game09 — Plus Power. Addition up to 20. */
var HUD={en:'ADD IT UP',de:'RECHNE PLUS',pl:'DODAJ',es:'SUMA'};
var ASK={en:function(a,b){return a+' plus '+b+'?';},de:function(a,b){return a+' plus '+b+'?';},pl:function(a,b){return a+' plus '+b+'? Ile to jest?';},es:function(a,b){return a+' más '+b+'?';}};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
IG_GAME({
  id:'game09', icon:'➕', hero:'🦸', villain:'🐉', castle:'🏰',
  text:{
    en:{tag:'Math · Grades 1–2 · Game #9', title:'Plus ', titleEm:'Power!', desc:'Add the two numbers and pop the answer (up to 20).', quest:'➕ Power up the hero! Every correct sum adds energy to reach the castle.', questLbl:'POWER UP'},
    de:{tag:'Mathe · Kl. 1–2 · Spiel #9', title:'Plus-', titleEm:'Power!', desc:'Addiere die zwei Zahlen und triff das Ergebnis (bis 20).', quest:'➕ Lade den Helden auf! Jede richtige Summe gibt Energie bis zur Burg.', questLbl:'AUFLADEN'},
    pl:{tag:'Matematyka · Kl. 1–2 · Gra #9', title:'Moc ', titleEm:'Plusa!', desc:'Dodaj dwie liczby i traf wynik (do 20).', quest:'➕ Naładuj bohatera! Każda poprawna suma dodaje energii w drodze do zamku.', questLbl:'NAŁADUJ'},
    es:{tag:'Mates · Grados 1–2 · Juego #9', title:'Poder ', titleEm:'Suma!', desc:'Suma los dos números y revienta la respuesta (hasta 20).', quest:'➕ ¡Carga al héroe! Cada suma correcta da energía para llegar al castillo.', questLbl:'¡CARGA!'}
  },
  rounds:function(lang,level,mode,count){
    var out=[], max=(level==='challenge'?20:level==='gentle'?10:15);
    for(var i=0;i<count;i++){
      var a=1+(Math.random()*(max-1)|0), b=1+(Math.random()*(max-a)|0); var s=a+b;
      var d={}; while(Object.keys(d).length<3){var v=s+ (Math.random()*7|0)-3; if(v>=0&&v!==s)d[v]=1;}
      out.push({hud:HUD[lang]||HUD.en, big:a+' + '+b, word:null, speech:(ASK[lang]||ASK.en)(a,b), praise:a+' + '+b+' = '+s, correct:String(s), distractors:shuf(Object.keys(d))});
    }
    return out;
  }
});
</script>
</body></html>
